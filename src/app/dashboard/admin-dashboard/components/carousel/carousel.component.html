<div
  #customCarousel
  id="customCarousel"
  class="carousel slide"
  data-bs-ride="carousel"
>
  <div class="carousel-inner">
    <div class="carousel-item active">
      <div class="carousel-img-wrapper">
        <img
          src="/assets/img/sena_carrusel.png"
          alt="Imagen 1"
          class="carousel-img"
        />
      </div>
    </div>
    <div class="carousel-item">
      <div class="carousel-img-wrapper">
        <img
          src="/assets/img/ImgLoginInstructor.jpg"
          alt="Imagen 2"
          class="carousel-img"
        />
      </div>
    </div>
    <div class="carousel-item">
      <div class="carousel-img-wrapper">
        <img
          src="/assets/img/sena_carrusel.png"
          alt="Imagen 3"
          class="carousel-img"
        />
      </div>
    </div>
    <div class="carousel-item">
      <div class="carousel-img-wrapper">
        <img
          src="/assets/img/ImgLoginInstructor.jpg"
          alt="Imagen 4"
          class="carousel-img"
        />
      </div>
    </div>
  </div>

  <button
    class="carousel-control-prev"
    type="button"
    data-bs-target="#customCarousel"
    data-bs-slide="prev"
  >
    <span class="carousel-control-prev-icon"></span>
  </button>
  <button
    class="carousel-control-next"
    type="button"
    data-bs-target="#customCarousel"
    data-bs-slide="next"
  >
    <span class="carousel-control-next-icon"></span>
  </button>
</div>
